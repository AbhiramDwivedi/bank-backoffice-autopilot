<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 662" width="1000" height="662" role="img" aria-labelledby="ov-t ov-d">
  <title id="ov-t">Learn once. Execute deterministically.</title>
  <desc id="ov-d">Left: LEARN, done once with an AI model. A goal in plain words plus typed inputs goes to an AI agent that works through the app, and a recorder keeps only the verified actions. Centre: the result is a CAPABILITY, one versioned file with typed inputs and outputs, verified steps with checkpoints, business outcomes, recovery rules, risk level and per-tenant overrides, and provenance and version. It is validated, audited, checked with a verifying replay and approved before use. Right: DO, every time, with no AI model. The capability is replayed step by step and each run ends in success, a business outcome (a real answer such as member not found), or a typed hard failure with evidence, or it is escalated: a person takes over the same live session in the Relay console, fixes it and hands back, and the run resumes. Underneath everything: safety on every action, by the AI or by replay: policy guard, approval, credentials by name, screen masking, and evidence for every run. Works on legacy web apps in a browser and on Windows desktop apps, with the same capability format and the same replay.</desc>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .h1 { font-size: 27px; font-weight: 700; }
    .lead { font-size: 16px; fill: #59636e; }
    .hd { font-size: 21px; font-weight: 700; letter-spacing: 1.5px; }
    .pill { font-size: 14px; font-weight: 700; fill: #ffffff; }
    .bt { font-size: 17px; font-weight: 700; }
    .bs { font-size: 15px; fill: #4b535c; }
    .li { font-size: 16px; }
    .learn { fill: #6639ba; }
    .do { fill: #0550ae; }
    .warm { fill: #953800; }
  </style>
  <defs>
    <marker id="a-learn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8250df"/></marker>
    <marker id="a-do" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker>
    <marker id="a-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker>
    <marker id="a-warm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/></marker>
  </defs>

  <rect x="1" y="1" width="998" height="660" rx="18" fill="#ffffff" stroke="#d1d9e0" stroke-width="2"/>

  <text class="h1" x="500" y="46" text-anchor="middle">Learn once. Execute deterministically.</text>
  <text class="lead" x="500" y="72" text-anchor="middle">Automating legacy back-office apps that have no API</text>

  <!-- LEARN -->
  <text class="hd learn" x="24" y="115">LEARN</text>
  <rect x="106" y="96" width="126" height="26" rx="13" fill="#8250df"/>
  <text class="pill" x="169" y="114" text-anchor="middle">once · uses AI</text>

  <g>
    <rect x="24" y="132" width="220" height="92" rx="12" fill="#fbefff" stroke="#c297ff" stroke-width="1.5"/>
    <g transform="translate(52,178)" fill="none" stroke="#8250df" stroke-width="2.5">
      <circle r="14"/><circle r="7.5"/><circle r="2.5" fill="#8250df" stroke="none"/>
    </g>
    <text class="bt" x="80" y="164">A goal</text>
    <text class="bs" x="80" y="186">in plain words,</text>
    <text class="bs" x="80" y="206">plus typed inputs</text>
  </g>
  <line x1="134" y1="226" x2="134" y2="247" stroke="#8250df" stroke-width="2.5" marker-end="url(#a-learn)"/>
  <g>
    <rect x="24" y="251" width="220" height="92" rx="12" fill="#fbefff" stroke="#c297ff" stroke-width="1.5"/>
    <g transform="translate(52,297)" fill="#8250df">
      <path d="M0,-15 C1.8,-5 5,-1.8 15,0 C5,1.8 1.8,5 0,15 C-1.8,5 -5,1.8 -15,0 C-5,-1.8 -1.8,-5 0,-15 Z"/>
      <path d="M11,-15 C11.6,-12 12,-11.6 15,-11 C12,-10.4 11.6,-10 11,-7 C10.4,-10 10,-10.4 7,-11 C10,-11.6 10.4,-12 11,-15 Z"/>
    </g>
    <text class="bt" x="80" y="283">AI agent</text>
    <text class="bs" x="80" y="305">works through</text>
    <text class="bs" x="80" y="325">the app</text>
  </g>
  <line x1="134" y1="345" x2="134" y2="366" stroke="#8250df" stroke-width="2.5" marker-end="url(#a-learn)"/>
  <g>
    <rect x="24" y="370" width="220" height="92" rx="12" fill="#fbefff" stroke="#c297ff" stroke-width="1.5"/>
    <g transform="translate(52,416)">
      <circle r="14" fill="none" stroke="#8250df" stroke-width="2.5"/><circle r="6.5" fill="#8250df"/>
    </g>
    <text class="bt" x="80" y="402">Recorder</text>
    <text class="bs" x="80" y="424">keeps only</text>
    <text class="bs" x="80" y="444">verified actions</text>
  </g>
  <line x1="246" y1="416" x2="283" y2="416" stroke="#8250df" stroke-width="3" marker-end="url(#a-learn)"/>

  <!-- CAPABILITY -->
  <path d="M296,98 H556 L594,136 V482 Q594,490 586,490 H296 Q288,490 288,482 V106 Q288,98 296,98 Z" fill="#d8dee4" transform="translate(5,6)"/>
  <path d="M296,98 H556 L594,136 V482 Q594,490 586,490 H296 Q288,490 288,482 V106 Q288,98 296,98 Z" fill="#ffffff" stroke="#1f2328" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M556,98 V128 Q556,136 564,136 H594 Z" fill="#d8dee4" stroke="#1f2328" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="310" y="136" font-size="25" font-weight="700" letter-spacing="1.5">CAPABILITY</text>
  <text class="bs" x="310" y="160">one versioned file per task</text>
  <line x1="310" y1="176" x2="572" y2="176" stroke="#d8dee4" stroke-width="1.5"/>
  <g fill="#1f2328">
    <rect x="310" y="195" width="8" height="8" rx="2"/>
    <rect x="310" y="223" width="8" height="8" rx="2"/>
    <rect x="310" y="251" width="8" height="8" rx="2"/>
    <rect x="310" y="279" width="8" height="8" rx="2"/>
    <rect x="310" y="307" width="8" height="8" rx="2"/>
    <rect x="310" y="335" width="8" height="8" rx="2"/>
  </g>
  <text class="li" x="328" y="204">Typed inputs and outputs</text>
  <text class="li" x="328" y="232">Verified steps + checkpoints</text>
  <text class="li" x="328" y="260">Business outcomes</text>
  <text class="li" x="328" y="288">Recovery rules</text>
  <text class="li" x="328" y="316">Risk level, tenant overrides</text>
  <text class="li" x="328" y="344">Provenance and version</text>
  <g>
    <rect x="304" y="368" width="274" height="104" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
    <text class="bt" x="320" y="394">Checked before use</text>
    <text class="bs" x="320" y="420">Validate → Audit →</text>
    <text class="bs" x="320" y="442">Verifying replay → Approve</text>
  </g>

  <line x1="596" y1="234" x2="627" y2="234" stroke="#0969da" stroke-width="3" marker-end="url(#a-do)"/>

  <!-- DO -->
  <text class="hd do" x="632" y="115">DO</text>
  <rect x="674" y="96" width="156" height="26" rx="13" fill="#0969da"/>
  <text class="pill" x="752" y="114" text-anchor="middle">every time · no AI</text>

  <g>
    <rect x="632" y="132" width="104" height="204" rx="12" fill="#ddf4ff" stroke="#80ccff" stroke-width="1.5"/>
    <circle cx="684" cy="190" r="20" fill="#0969da"/>
    <path d="M677,179 L694,190 L677,201 Z" fill="#ffffff"/>
    <text class="bt" x="684" y="242" text-anchor="middle">Replay</text>
    <text class="bs" x="684" y="264" text-anchor="middle">step by step,</text>
    <text class="bs" x="684" y="284" text-anchor="middle">same way</text>
    <text class="bs" x="684" y="304" text-anchor="middle">every time</text>
  </g>
  <g fill="none" stroke-width="2.5">
    <path d="M738,234 C752,234 750,160 761,160" stroke="#0969da" marker-end="url(#a-do)"/>
    <path d="M738,234 H761" stroke="#0969da" marker-end="url(#a-do)"/>
    <path d="M738,234 C752,234 750,308 761,308" stroke="#59636e" marker-end="url(#a-ink)"/>
  </g>
  <g>
    <rect x="766" y="132" width="210" height="56" rx="10" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/>
    <circle cx="788" cy="160" r="11" fill="#0969da"/>
    <path d="M782,160.5 L786.5,165 L794.5,155.5" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="bt" x="808" y="155">Success</text>
    <text class="bs" x="808" y="176">outputs returned</text>
  </g>
  <g>
    <rect x="766" y="196" width="210" height="76" rx="10" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/>
    <circle cx="788" cy="234" r="10" fill="#ffffff" stroke="#0969da" stroke-width="2.5"/>
    <circle cx="788" cy="229" r="1.8" fill="#0969da"/>
    <rect x="786.5" y="232.5" width="3" height="7" rx="1.2" fill="#0969da"/>
    <text class="bt" x="808" y="219">Business outcome</text>
    <text class="bs" x="808" y="241">“member not found”:</text>
    <text class="bs" x="808" y="261">a real answer</text>
  </g>
  <g>
    <rect x="766" y="280" width="210" height="56" rx="10" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/>
    <circle cx="788" cy="308" r="11" fill="#59636e"/>
    <path d="M783.5,303.5 L792.5,312.5 M792.5,303.5 L783.5,312.5" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <text class="bt" x="808" y="303">Hard failure</text>
    <text class="bs" x="808" y="324">typed, with evidence</text>
  </g>

  <!-- escalation loop -->
  <line x1="660" y1="338" x2="660" y2="381" stroke="#bc4c00" stroke-width="3" marker-end="url(#a-warm)"/>
  <line x1="708" y1="384" x2="708" y2="342" stroke="#bc4c00" stroke-width="3" marker-end="url(#a-warm)"/>
  <text class="bt warm" x="720" y="359">hands back,</text>
  <text class="bt warm" x="720" y="377">run resumes</text>
  <g>
    <rect x="632" y="386" width="344" height="104" rx="12" fill="#fff1e5" stroke="#ffb77c" stroke-width="1.5"/>
    <g transform="translate(662,422)" fill="#bc4c00">
      <circle cx="0" cy="-7" r="7"/>
      <path d="M-12,14 C-12,3 -6,-1 0,-1 C6,-1 12,3 12,14 Z"/>
    </g>
    <text class="bt warm" x="690" y="411">Escalated</text>
    <text class="bs" x="690" y="434">Can't continue safely? A person</text>
    <text class="bs" x="690" y="454">takes over the same live session</text>
    <text class="bs" x="690" y="474">in <tspan font-weight="700" fill="#1f2328">Relay</tspan> and fixes it</text>
  </g>

  <!-- SAFETY RAIL -->
  <g>
    <rect x="24" y="508" width="952" height="96" rx="14" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
    <path d="M52,520 L64,525 V533 C64,541 58,546 52,548 C46,546 40,541 40,533 V525 Z" fill="#59636e"/>
    <path d="M47,534 L51,538 L58,530" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="74" y="540"><tspan class="bt">Safety on every action</tspan><tspan class="bs"> · by the AI or by replay</tspan></text>
    <g fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5">
      <rect x="40" y="556" width="122" height="34" rx="17"/>
      <rect x="212" y="556" width="100" height="34" rx="17"/>
      <rect x="362" y="556" width="174" height="34" rx="17"/>
      <rect x="586" y="556" width="144" height="34" rx="17"/>
      <rect x="780" y="556" width="180" height="34" rx="17"/>
    </g>
    <g class="li" text-anchor="middle">
      <text x="101" y="578">Policy guard</text>
      <text x="262" y="578">Approval</text>
      <text x="449" y="578">Credentials by name</text>
      <text x="658" y="578">Screen masking</text>
      <text x="870" y="578">Evidence for every run</text>
    </g>
  </g>

  <!-- APPS -->
  <g id="apps">
    <text class="bt" x="139" y="640">Works on</text>
    <g transform="translate(227,624)" fill="none" stroke="#1f2328" stroke-width="2">
      <rect x="0" y="0" width="26" height="20" rx="3"/><line x1="0" y1="6" x2="26" y2="6"/>
      <circle cx="4" cy="3" r="0.8" fill="#1f2328"/><circle cx="7.5" cy="3" r="0.8" fill="#1f2328"/>
    </g>
    <text class="li" x="261" y="640">Legacy web apps</text>
    <g transform="translate(401,624)" fill="none" stroke="#1f2328" stroke-width="2">
      <rect x="0" y="0" width="26" height="20" rx="2"/><rect x="0" y="0" width="26" height="5" fill="#1f2328"/>
      <line x1="13" y1="5" x2="13" y2="20"/><line x1="0" y1="12.5" x2="26" y2="12.5"/>
    </g>
    <text class="li" x="435" y="640">Windows desktop apps</text>
    <text class="bs" x="617" y="640">· same capability format, same replay</text>
  </g>
</svg>
