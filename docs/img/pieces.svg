<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d">
  <title id="t">How the pieces fit</title>
  <desc id="d">The robot drives the mock app. When the app throws a problem the robot cannot get past, Relay calls a human, who takes over the same browser and hands it back. The browser agent lives inside the page, names controls for the robot, and records what the human clicks.</desc>
  <style>
    .bg { fill: #ffffff; }
    .ink { fill: #1f2328; }
    .muted { fill: #59636e; }
    .line { stroke: #59636e; }
    .robot { fill: #ddf4ff; stroke: #0969da; }
    .robot-ink { fill: #0969da; }
    .relay { fill: #fbefff; stroke: #8250df; }
    .relay-ink { fill: #8250df; }
    .agent { fill: #dafbe1; stroke: #1a7f37; }
    .agent-ink { fill: #1a7f37; }
    text { font-family: -apple-system, "Segoe UI", system-ui, sans-serif; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .ink { fill: #e6edf3; }
      .muted { fill: #9198a1; }
      .line { stroke: #9198a1; }
      .robot { fill: #0c2d6b; stroke: #4493f8; }
      .robot-ink { fill: #4493f8; }
      .relay { fill: #2e1a4f; stroke: #ab7df8; }
      .relay-ink { fill: #ab7df8; }
      .agent { fill: #0f3d1f; stroke: #3fb950; }
      .agent-ink { fill: #3fb950; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="muted"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="400"/>

  <!-- The robot (apps/cu) -->
  <line class="line" x1="120" y1="112" x2="120" y2="90" stroke-width="3"/>
  <circle class="robot-ink" cx="120" cy="84" r="7"/>
  <rect class="robot" x="70" y="112" width="100" height="78" rx="16" stroke-width="3"/>
  <circle class="robot-ink" cx="100" cy="145" r="9"/>
  <circle class="robot-ink" cx="140" cy="145" r="9"/>
  <rect class="robot-ink" x="100" y="167" width="40" height="6" rx="3"/>
  <rect class="robot" x="86" y="198" width="68" height="38" rx="10" stroke-width="3"/>
  <text class="ink" x="120" y="270" text-anchor="middle" font-size="18" font-weight="700">The robot</text>
  <text class="muted mono" x="120" y="291" text-anchor="middle" font-size="13">apps/cu</text>
  <text class="muted" x="120" y="314" text-anchor="middle" font-size="13">does the task the same</text>
  <text class="muted" x="120" y="331" text-anchor="middle" font-size="13">way every time</text>

  <!-- robot -> app -->
  <line class="line" x1="182" y1="150" x2="324" y2="150" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text class="muted" x="253" y="139" text-anchor="middle" font-size="13">drives</text>

  <!-- 1. Mock app: a deliberately dated window -->
  <text class="ink" x="480" y="44" text-anchor="middle" font-size="18" font-weight="700">1 · Mock app</text>
  <rect x="330" y="60" width="300" height="230" fill="#d4d0c8" stroke="#808080" stroke-width="2"/>
  <rect x="332" y="62" width="296" height="26" fill="#0a246a"/>
  <text x="342" y="80" font-size="12" fill="#ffffff" font-family="Tahoma, Verdana, sans-serif">CU Core Workstation 7.4.2</text>
  <rect x="592" y="67" width="16" height="16" fill="#d4d0c8" stroke="#404040"/>
  <rect x="610" y="67" width="16" height="16" fill="#d4d0c8" stroke="#404040"/>
  <text x="352" y="118" font-size="12" fill="#000000" font-family="Tahoma, Verdana, sans-serif">Member ID</text>
  <rect x="430" y="104" width="120" height="20" fill="#ffffff" stroke="#808080"/>
  <rect x="560" y="104" width="54" height="20" fill="#e4e0d8" stroke="#404040"/>
  <text x="587" y="118" font-size="11" fill="#000000" text-anchor="middle" font-family="Tahoma, Verdana, sans-serif">Search</text>
  <rect x="352" y="138" width="262" height="12" fill="#c0bcb4"/>
  <rect x="352" y="156" width="200" height="12" fill="#c0bcb4"/>
  <rect x="352" y="174" width="230" height="12" fill="#c0bcb4"/>
  <!-- the problem it throws -->
  <rect x="346" y="198" width="268" height="36" rx="3" fill="#fff4cc" stroke="#b08800" stroke-width="2"/>
  <path d="M366,224 L376,206 L386,224 Z" fill="#b08800"/>
  <text x="376" y="222" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">!</text>
  <text x="396" y="221" font-size="13" font-weight="700" fill="#5c4400">Session expired</text>

  <!-- 2. Browser agent: lives inside the page -->
  <rect class="agent" x="446" y="246" width="170" height="32" rx="6" stroke-width="2" stroke-dasharray="5 3"/>
  <text class="agent-ink" x="531" y="267" text-anchor="middle" font-size="13" font-weight="700">2 · browser agent</text>

  <text class="muted" x="480" y="314" text-anchor="middle" font-size="13">an old, clunky bank app</text>
  <text class="muted" x="480" y="331" text-anchor="middle" font-size="13">that breaks on purpose</text>

  <!-- app -> Relay -->
  <line class="line" x1="636" y1="120" x2="736" y2="120" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text class="muted" x="686" y="95" text-anchor="middle" font-size="13">stuck?</text>
  <text class="muted" x="686" y="111" text-anchor="middle" font-size="13">call a human</text>
  <!-- Relay -> app -->
  <line class="line" x1="736" y1="210" x2="622" y2="214" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text class="muted" x="686" y="236" text-anchor="middle" font-size="13">fixes it,</text>
  <text class="muted" x="686" y="252" text-anchor="middle" font-size="13">hands back</text>

  <!-- 3. Relay -->
  <rect class="relay" x="742" y="80" width="156" height="150" rx="12" stroke-width="3"/>
  <text class="relay-ink" x="820" y="106" text-anchor="middle" font-size="14" font-weight="700">Relay</text>
  <circle class="relay-ink" cx="820" cy="138" r="16"/>
  <path class="relay-ink" d="M792,186 Q792,160 820,160 Q848,160 848,186 Z"/>
  <rect class="relay-ink" x="772" y="196" width="96" height="22" rx="11"/>
  <text x="820" y="211" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Take control</text>
  <text class="ink" x="820" y="270" text-anchor="middle" font-size="18" font-weight="700">3 · Relay</text>
  <text class="muted mono" x="820" y="291" text-anchor="middle" font-size="13">apps/relay</text>
  <text class="muted" x="820" y="314" text-anchor="middle" font-size="13">brings in a human, who</text>
  <text class="muted" x="820" y="331" text-anchor="middle" font-size="13">drives the same browser</text>

  <!-- agent caption -->
  <text class="agent-ink" x="480" y="372" text-anchor="middle" font-size="13">2 lives inside the page: it tells the robot what each button is,</text>
  <text class="agent-ink" x="480" y="390" text-anchor="middle" font-size="13">and notes what the human clicks (never what they type).</text>
</svg>
