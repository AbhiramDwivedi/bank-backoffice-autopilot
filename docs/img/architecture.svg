      <rect x="878" y="538" width="82" height="14" rx="2"/>
      <rect x="878" y="562" width="82" height="14" rx="2"/>
      <rect x="902" y="584" width="58" height="14" rx="2" fill="#eaeef2"/>
    </g>
    <g fill="#d8dee4"><rect x="816" y="540" width="50" height="10" rx="3"/><rect x="816" y="564" width="50" height="10" rx="3"/></g>
  </g>
  <text class="bs" x="518" y="634"><tspan font-weight="700" fill="#0550ae">Beside the app:</tspan> nothing injected into it;</text>
  <text class="bs" x="518" y="654">never takes the mouse, keyboard or focus</text>
</svg>
