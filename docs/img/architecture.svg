      <rect x="42" y="566" width="70" height="10" rx="3"/><rect x="122" y="564" width="116" height="14" rx="3" fill="none" stroke="#d1d9e0" stroke-width="1.5"/>
      <rect x="42" y="590" width="56" height="16" rx="3" fill="#eaeef2" stroke="#d1d9e0" stroke-width="1.5"/>
    </g>
    <rect x="258" y="538" width="212" height="68" rx="10" fill="#0969da"/>
    <text class="bt wt" x="272" y="565">in-page agent</text>
    <text class="bs wt" x="272" y="588">names and lists controls</text>
    <text class="bs" x="42" y="634"><tspan font-weight="700" fill="#0550ae">Inside the page:</tspan> injected by the runtime,</text>
    <text class="bs" x="42" y="654">or shipped by the app like a monitoring tag</text>
  </g>

  <!-- WINDOWS APP: bridge BESIDE the app -->
  <line x1="598" y1="452" x2="598" y2="519" stroke="#0969da" stroke-width="2.5" marker-end="url(#b-do)"/>
  <text class="bs" x="610" y="494">JSON lines</text>
  <g>
    <rect x="526" y="524" width="144" height="72" rx="12" fill="#0969da"/>
    <text class="bt wt" x="598" y="554" text-anchor="middle">bridge</text>
    <text class="bs wt" x="598" y="577" text-anchor="middle">its own process</text>
  </g>
  <line x1="672" y1="574" x2="795" y2="574" stroke="#0969da" stroke-width="2.5" marker-end="url(#b-do)"/>
  <text class="bs" x="735" y="544" text-anchor="middle">UI Automation +</text>
  <text class="bs" x="735" y="562" text-anchor="middle">window messages</text>
  <g>
