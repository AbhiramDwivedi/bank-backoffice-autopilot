<!doctype html>
<html>
<head><meta charset="utf-8"><title>Mask fields</title>
<style>
  body { margin: 0; background: #ffffff; }
  input { display: block; width: 400px; height: 60px; margin: 20px; font: bold 32px Arial, sans-serif; border: 0; background: #ffffff; color: #000000; }
  /* Typed values and the password are painted in the PII colour; the untouched field in blue. */
  #user, #pw { color: #ff00aa; }
  #nick { color: #0000ff; }
</style>
</head>
<body>
  <table>
    <tr><td>User ID</td><td><input id="user" type="text"></td></tr>
    <tr><td>Nickname</td><td><input id="nick" type="text" value="plainvisible"></td></tr>
    <tr><td>Password</td><td><input id="pw" type="password" value="pw-value-123"></td></tr>
  </table>
</body>
</html>
