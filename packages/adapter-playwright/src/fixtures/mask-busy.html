<!doctype html>
<html>
<head><meta charset="utf-8"><title>Busy page</title>
<style>
  body { margin: 0; font: bold 22px Arial, sans-serif; background: #fff; color: #000; }
  .pii { color: #ff00aa; }
  iframe { width: 600px; height: 120px; border: 0; display: block; }
</style>
</head>
<body>
  <table id="t"><thead><tr><th>Name</th><th>Address</th></tr></thead><tbody id="rows"></tbody></table>
  <iframe name="ticker" src="mask-busy-frame.html"></iframe>
  <script>
    // A polling widget: the rows are re-rendered every 100 ms with fresh values.
    var n = 0;
    function render() {
      n++;
      var html = '';
      for (var i = 0; i < 5; i++) html += '<tr><td>Row ' + i + '</td><td class="pii">' + (100 + n * 7 + i) + ' Elm St</td></tr>';
      document.getElementById('rows').innerHTML = html;
    }
    render();
    setInterval(render, 100);
  </script>
</body>
</html>
