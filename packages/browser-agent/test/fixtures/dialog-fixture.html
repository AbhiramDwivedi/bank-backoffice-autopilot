<!doctype html>
<html>
<head><meta charset="utf-8"><title>Dialog fixture</title></head>
<body>
  <h1>Member Detail</h1>
  <button id="confirm-btn" onclick="document.getElementById('result').textContent = String(confirm('Delete record?'));">Delete</button>
  <button id="alert-btn" onclick="alert('Just an alert'); document.getElementById('result2').textContent = 'alert-done';">Show Alert</button>
  <div id="result"></div>
  <div id="result2"></div>
</body>
</html>
