<!doctype html>
<html>
<head><meta charset="utf-8"><title>Adjacent cell labels</title></head>
<body>
  <table>
    <tr>
      <td>Member ID:</td>
      <td><img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" width="8" height="1" alt=""></td>
      <td><input id="member-id" name="member_id" type="text"></td>
    </tr>
    <tr>
      <td style="text-transform: uppercase">Branch code:</td>
      <td><input id="branch" name="branch" type="text"></td>
    </tr>
    <tr>
      <td>Primary mailing address for all statements, notices and year-end tax documents sent to this member</td>
      <td><input id="mailing" name="mailing" type="text"></td>
    </tr>
  </table>
</body>
</html>
