<!doctype html>
<html>
<head><meta charset="utf-8"><title>Capture submit</title></head>
<body>
  <h1>Capture Submit</h1>
  <form id="frm" onsubmit="return false;">
    <input id="text-field" name="text" type="text">
    <input id="pw-field" name="pw" type="password">
    <select id="select-field" name="sel">
      <option value="a">A</option>
      <option value="b">B</option>
    </select>
    <textarea id="ta-field" name="ta"></textarea>
    <input id="submit-btn" type="submit" value="Go">
  </form>
</body>
</html>
