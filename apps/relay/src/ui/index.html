<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>Relay</title>
<link rel="icon" href="data:image/png;base64,iVBORw0KGgo=">
<link rel="stylesheet" href="/assets/app.css">
<script src="/assets/boot.js"></script>
<script src="/assets/app.js" defer></script>
</head>
<body>
<a class="skip-link" href="#detail">Skip to the intervention</a>

<header class="topbar">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
      <path d="M3 8h11l-3-3M21 16H10l3 3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="brand-name">Relay</span>
  </div>
  <div class="topbar-status">
    <span id="conn-status" class="conn" data-state="connecting" role="status">
      <span class="conn-dot" aria-hidden="true"></span><span class="conn-label">Connecting</span>
    </span>
  </div>
  <div class="topbar-tools">
    <label class="operator-field" for="operator-name">
      <span class="field-label">Operator</span>
      <input id="operator-name" name="operator" type="text" maxlength="100" autocomplete="nickname" spellcheck="false">
    </label>
    <div id="theme-switch" class="segmented" role="radiogroup" aria-label="Theme">
      <button type="button" role="radio" data-theme-choice="system" aria-checked="true">System</button>
      <button type="button" role="radio" data-theme-choice="light" aria-checked="false">Light</button>
      <button type="button" role="radio" data-theme-choice="dark" aria-checked="false">Dark</button>
    </div>
  </div>
</header>

<div class="shell">
  <nav id="queue" class="pane pane-queue" aria-label="Intervention queue"></nav>
  <main id="detail" class="pane pane-detail" tabindex="-1" aria-label="Intervention"></main>
  <aside id="act" class="pane pane-act" aria-label="Act on the intervention"></aside>
</div>

<section id="toasts" class="toasts" aria-label="Notifications" aria-live="polite" aria-relevant="additions"></section>

<dialog id="confirm-dialog" class="dialog" aria-labelledby="confirm-title" aria-describedby="confirm-body">
  <form method="dialog" class="dialog-form">
    <h2 id="confirm-title" class="dialog-title"></h2>
    <p id="confirm-body" class="dialog-body"></p>
    <div class="dialog-actions">
      <button id="confirm-cancel" type="submit" value="cancel" class="btn btn-secondary">Cancel</button>
      <button id="confirm-ok" type="submit" value="ok" class="btn btn-danger"></button>
    </div>
  </form>
</dialog>
<!--RELAY_BOOTSTRAP-->
</body>
</html>
